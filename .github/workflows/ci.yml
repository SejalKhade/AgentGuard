name: AgentGuard CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=modules --cov-report=term-missing --cov-fail-under=80

      - name: Verify critical action classification
        run: |
          python -c "
          from modules.risk_scorer import RiskScorer, Action
          scorer = RiskScorer()
          kiro_action = Action(
              name='recreate_environment',
              target='prod-cost-explorer-china',
              agent_id='ci-test',
              parameters={'force': True, 'all': True}
          )
          result = scorer.classify(kiro_action)
          assert result['blast_radius'] == 3, f'Kiro action must be CATASTROPHIC, got {result[\"blast_radius\"]}'
          assert result['gate_required'] is True, 'Gate must be required for CATASTROPHIC'
          print('PASS: Kiro incident action correctly classified as CATASTROPHIC')
          "

      - name: Smoke-test the REST API
        run: |
          uvicorn api:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf -X POST http://127.0.0.1:8000/score \
            -H 'Content-Type: application/json' \
            -d '{"name":"recreate_environment","target":"prod","agent_id":"ci","parameters":{"all":true}}' \
            | python -c "import sys,json; b=json.load(sys.stdin); assert b['allowed'] is False and b['classification']['blast_radius']==3; print('PASS: API blocks the Kiro action')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t agentguard:${{ github.sha }} .
      - name: Verify container starts
        run: |
          docker run -d --name agentguard-test -p 8501:8501 agentguard:${{ github.sha }}
          sleep 5
          docker ps | grep agentguard-test
          docker stop agentguard-test
